<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>כתבות על החיות - גן החיות התנ"כי</title>
    <link rel="icon" type="image/png" href="../images/icon.jpg">
    <link rel="stylesheet" href="../style/worlds.css">
    <link rel="stylesheet" href="../style/style.css">
</head>

<body class="world-page jungle-page">
    <a href="main_page.html#worlds" class="close-btn" title="יציאה">&times;</a>
    <article class="world-container">
        <h1>ממלכת הג'ונגל-</h1>
        <section class="cards">
            <div class="name-img">
                <div clas="flip-card-wrap">
                    <div class="animal-card">
                        <input type="checkbox" class="card-toggle">
                        <div class="inner-card">
                            <div class="card-front  jungle-border">
                                <img src="../images/orangtoan.jpg" alt="אורנגטואן">
                            </div>
                            <div class="card-back  jungle-border">
                                <p></p>
                            </div>
                        </div>
                    </div>
                </div>
                <h2>אורנגטואן</h2>
            </div>
            <div class="name-img">
                <div class="animal-card">
                    <div class="inner-card">
                        <div class="card-front  jungle-border">
                            <img src="../images/snake.jpg" alt="נחש">
                        </div>
                        <div class="card-back  jungle-border">
                            <p></p>
                        </div>
                    </div>
                </div>
                <h2>נחש</h2>
            </div>
            <div class="name-img">
                <div class="animal-card">
                    <div class="inner-card">
                        <div class="card-front  jungle-border">
                            <img src="../images/jaguar.jpg" alt="יגואר">
                        </div>
                        <div class="card-back  jungle-border">
                            <p></p>
                        </div>
                    </div>
                </div>
                <h2>יגואר</h2>
            </div>

            <div class="name-img">
                <div class="animal-card">
                    <div class="inner-card">
                        <div class="card-front  jungle-border">
                            <img src="../images/lemur.jpg" alt="למור">
                        </div>
                        <div class="card-back  jungle-border">
                            <p></p>
                        </div>
                    </div>
                </div>
                <h2>למור</h2>
            </div>
        </section>
        <audio id="savanna-audio" loop autoplay controls>
            <source src="../audio/monkeys.mp3" type="audio/mpeg">
            הדפדפן שלך לא תומך בניגון אודיו.
        </audio>
    </article>
</body>
