<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>כתבות על החיות - גן החיות התנ"כי</title>
    <link rel="icon" type="image/png" href="../images/icon.jpg">
    <link rel="stylesheet" href="../style/worlds.css">
    <link rel="stylesheet" href="../style/style.css">
</head>

<body class="world-page birds-page">
    <a href="main_page.html#worlds" class="close-btn" title="יציאה">&times;</a>
    <article class="world-container">
        <h1>הציפורים והאגם-</h1>
        <section class="cards">
            <div class="name-img">
                <div clas="flip-card-wrap">
                    <div class="animal-card">
                        <input type="checkbox" class="card-toggle">
                        <div class="inner-card">
                            <div class="card-front  birds-border">
                                <img src="../images/swan.jpg" alt="ברבור">
                            </div>
                            <div class="card-back  birds-border">
                                <p></p>
                            </div>
                        </div>
                    </div>
                </div>
                <h2>ברבור</h2>
            </div>
            <div class="name-img">
                <div class="animal-card">
                    <div class="inner-card">
                        <div class="card-front  birds-border">
                            <img src="../images/stork.jpg" alt="חסידה">
                        </div>
                        <div class="card-back  birds-border">
                            <p></p>
                        </div>
                    </div>
                </div>
                <h2>חסידה</h2>
            </div>
            <div class="name-img">
                <div class="animal-card">
                    <div class="inner-card">
                        <div class="card-front  birds-border">
                            <img src="../images/flamingo.jpg" alt="פלמינגו">
                        </div>
                        <div class="card-back  birds-border">
                            <p></p>
                        </div>
                    </div>
                </div>
                <h2>פלמינגו</h2>
            </div>
            <div class="name-img">
                <div class="animal-card">
                    <div class="inner-card">
                        <div class="card-front  birds-border">
                            <img src="../images/pelican.jpg" alt="שקנאי">
                        </div>
                        <div class="card-back  birds-border">
                            <p></p>
                        </div>
                    </div>
                </div>
                <h2>שקנאי</h2>
            </div>
        </section>
        <audio id="savanna-audio" loop autoplay controls>
            <source src="../audio/birds.mp3" type="audio/mpeg">
            הדפדפן שלך לא תומך בניגון אודיו.
        </audio>
    </article>
</body>
